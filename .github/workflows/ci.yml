name: CI – Build, Test & Deploy

on:
  push:
    branches: ["**"]        # Kör på alla branches vid push
  pull_request:
    branches: ["main"]    # Kör på PRs mot main

jobs:

  # ── Job 1: Bygg och kör alla tester ─────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Installera .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Återställ NuGet-paket
        run: dotnet restore

      - name: Bygg solution
        run: dotnet build --no-restore --configuration Release

      - name: Kör alla enhetstester
        run: dotnet test --no-build --configuration Release --verbosity normal

  # ── Job 2: Publicera Blazor WASM ─────────────────────────────
  publish-blazor:
    runs-on: ubuntu-latest
    needs: build-and-test    # Kör bara om testerna gick igenom
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Installera .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installera Blazor WASM-verktyg
        run: dotnet workload install wasm-tools

      - name: Publicera Blazor-klienten
        run: dotnet publish FamilyGames.Client/FamilyGames.Client.csproj -c Release -o publish

      - name: Fixa routing för GitHub Pages (404 → index.html)
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Ladda upp som Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
          
      - name: Fixa routing för GitHub Pages
        run: |
          cat > publish/wwwroot/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script>
              var pathSegmentsToKeep = 1;
              var l = window.location;
              l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
              );
            </script>
          </head>
          <body></body>
          </html>
          EOF
      

  # ── Job 3: Deploya till GitHub Pages (bara på main) ──────────
  deploy:
    runs-on: ubuntu-latest
    needs: publish-blazor
    if: github.ref == 'refs/heads/main'   # Bara main deployas
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploya till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


        